<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8ef">
  <meta name="description" content="鱼渔陪你读懂题目，自己找到下一步。">
  <title>鱼渔 · 一小步，也很棒</title>
  <link rel="icon" href="fish-icon.png">
  <link rel="stylesheet" href="style.css?v=17">
  <script type="module" src="login.js?v=1"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><img src="fish-icon.png" alt="" width="42" height="42">鱼渔</div>
    <h1>登录家庭账号</h1>
    <p>和小鱼一起解题，接着上次的进度学。</p>
    <div id="family-auth">
      <div class="family-choices" role="group" aria-label="选择账号操作">
        <button id="family-login" type="button" aria-pressed="true">登录</button>
        <button id="family-create" type="button" aria-pressed="false">注册家庭账号</button>
      </div>
      <form id="family-form" class="account-form">
        <label for="family-name">家庭账号名</label>
        <input id="family-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="4" maxlength="24" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{3,23}">
        <small id="name-help" hidden>4–24 个字母、数字、下划线或短横线，以字母或数字开头。</small>
        <div id="recovery-entry" hidden><label for="reset-code">家长保存的找回码</label><input id="reset-code" autocomplete="off" spellcheck="false" maxlength="64"></div>
        <label for="family-password" id="password-label">密码</label>
        <input id="family-password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="64">
        <div id="confirm-entry" hidden><label for="confirm-password">再输入一次密码</label><input id="confirm-password" type="password" autocomplete="new-password" maxlength="64"></div>
        <button id="family-submit" class="button primary" type="submit">登录</button>
      </form>
      <button id="forgot-password" type="button" class="account-text">忘记密码？</button>
    </div>
    <p id="family-error" role="status" class="status"></p>
  </main>
</body>
</html>
